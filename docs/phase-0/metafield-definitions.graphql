# Payedaar Phase 0 — Metafield definition mutations
# Run via Shopify Admin GraphQL (Apps → develop apps → GraphiQL)
# or: shopify app / partner tooling with Admin API access.
# Skip any mutation that errors with "already taken" / exists.

mutation CreateProductSubtitle {
  metafieldDefinitionCreate(
    definition: {
      name: "Subtitle"
      namespace: "descriptors"
      key: "subtitle"
      type: "single_line_text_field"
      description: "Short PDP subtitle"
      ownerType: PRODUCT
    }
  ) {
    createdDefinition { id namespace key }
    userErrors { field message code }
  }
}

